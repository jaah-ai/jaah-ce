# Publishes the release images to GHCR when a `v*` tag lands (the mirror tags every release it publishes):
# ghcr.io/<this repository>-{api,web,node}:<version> and :latest. The api and web images are built for amd64 and
# arm64 on native runners and joined into one manifest; the node image is amd64 only (one of its CLIs ships no
# linux arm64 build). Each image is built from this repository's own files — what compose.yml's `build:` blocks
# build. Each joined image is signed with cosign (keyless: this run's GitHub OIDC identity, logged in Rekor). Once every
# image is up, the tag becomes a GitHub Release — what the installers install, so a tag whose images are still building
# is never picked — carrying compose.yml with every image pinned to its signed digest (.github/render_compose.py) and
# SHA256SUMS over it, which the installers check. The push uses this run's GITHUB_TOKEN; every action is pinned by
# commit SHA.
name: Release images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { image: api, arch: amd64, runner: ubuntu-24.04 }
          - { image: api, arch: arm64, runner: ubuntu-24.04-arm }
          - { image: web, arch: amd64, runner: ubuntu-24.04 }
          - { image: web, arch: arm64, runner: ubuntu-24.04-arm }
          - { image: node, arch: amd64, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build and push ${{ matrix.image }} (${{ matrix.arch }})
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          repo="ghcr.io/${GITHUB_REPOSITORY,,}-$IMAGE"
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform "linux/$ARCH" --build-arg "APP_VERSION=$version" \
            -f "Dockerfile.$IMAGE" -t "$repo:$version-$ARCH" --push .

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # the release
      packages: write
      id-token: write   # cosign's keyless signature: this run's OIDC identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Join each image's architectures under the version and latest, and sign the result
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for image in api web node; do
            repo="ghcr.io/${GITHUB_REPOSITORY,,}-$image"
            sources=("$repo:$version-amd64")
            [ "$image" = node ] || sources+=("$repo:$version-arm64")
            docker buildx imagetools create -t "$repo:$version" -t "$repo:latest" "${sources[@]}"
            digest="$(docker buildx imagetools inspect "$repo:$version" --format '{{json .Manifest}}' | jq -er .digest)"
            cosign sign --yes "$repo@$digest"
            echo "$image=$digest" >> "$RUNNER_TEMP/digests"
          done
      - name: Render the release's compose.yml and its SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets"
          # shellcheck disable=SC2046 # one api=/web=/node= argument per line
          python3 .github/render_compose.py compose.yml "${GITHUB_REF_NAME#v}" "ghcr.io/${GITHUB_REPOSITORY,,}" \
            $(cat "$RUNNER_TEMP/digests") > "$RUNNER_TEMP/assets/compose.yml"
          # Every file the installers fetch (install.sh, install.ps1).
          (cd "$RUNNER_TEMP/assets" && sha256sum compose.yml > SHA256SUMS)
      # A draft until both assets are up: the installers never see a latest release without its SHA256SUMS.
      - name: Release the tag with its compose.yml and SHA256SUMS
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api=(-H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json")
          release="$(curl -fsS -X POST "${api[@]}" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
            -d "$(jq -n --arg t "$GITHUB_REF_NAME" '{tag_name: $t, name: ("Jaah Community Edition " + $t), draft: true}')")"
          url="$(jq -er .url <<<"$release")"
          upload="$(jq -er .upload_url <<<"$release")"
          for asset in compose.yml SHA256SUMS; do
            curl -fsS -o /dev/null -X POST "${api[@]}" -H "Content-Type: application/octet-stream" \
              --data-binary "@$RUNNER_TEMP/assets/$asset" "${upload%%\{*}?name=$asset"
          done
          curl -fsS -o /dev/null -X PATCH "${api[@]}" "$url" -d '{"draft": false, "make_latest": "true"}'
