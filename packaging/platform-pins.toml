# platform-pins.toml — EVERY third-party artifact the macOS (darwin-arm64) and Windows (windows-x64) node
# bundles carry, and the interpreter the Linux `jaah-python` package ships (linux-x64, linux-arm64;
# read by its package builder), pinned by URL + sha256. The single home of those pins: the platform-bundle builder reads
# this file, downloads each artifact on the BUILDER (never on a node — a node fetches only the finished
# bundle, from the control plane's `/api/agent/dist/...` route), and refuses the build on any digest
# mismatch. Bump an artifact by changing its `url` AND `sha256` together in one commit.
#
# Each `[[artifact]]`:
#   id        unique name (what a failure names)
#   platform  darwin-arm64 | windows-x64 | linux-x64 | linux-arm64 (the `jaah-python` package; `python` only) |
#             build-linux-x64 (a BUILD TOOL: used on the Linux builder — the
#             import-smoke's python, the build toolchains — never shipped)
#   url       https only
#   sha256    of the downloaded bytes
#   format    tar.gz | tar.zst | conda | zip | whl | file
#   extract   [{ from, to }] — `from` is an archive member (a prefix when it ends in "/", "" = everything),
#             `to` the path under `versions/<ver>/` in the bundle. For `file`, `to` is the one destination.
#   exclude   optional fnmatch globs over member paths, dropped from every extract
#   exec      optional; true marks every extracted file executable
#   build     optional { tool, root, … }: the archive is SOURCE, compiled on the builder by the `tool`
#             (go | zig) build-linux-x64 pin (the builder's BUILD table holds the fields per tool).
#             `root` is the source dir in the archive; each extract rule's `to` is a binary it builds.
#   licence, licence_source   SPDX expression + the https page it was read from (re-read on every bump);
#             REQUIRED on every darwin-arm64 and linux-* pin. GPL-family binaries (git, stunnel) and LGPL dylibs MAY
#             ship in the macOS bundle — unmodified, dynamically linked, their source at licence_source/url
#             — and NEVER in the .deb (the package-licence check gates microvm-pins.toml).

schema = 1

# The interpreter the node runs. Every `python` artifact must carry this version in its URL, and the
# daemon must import under it (the build's import-smoke runs the build-linux-x64 twin of this exact
# version). 3.14 is the latest stable CPython. The Linux `jaah` .deb depends on `jaah-python (>= <this>)`.
[python]
version = "3.14.7"

