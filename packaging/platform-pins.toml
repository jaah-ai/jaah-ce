# ── Python wheels, unpacked WHOLE into vendor/<platform>/ ───────────────────────────────────────────
# `vendor/<platform>/` is the one site dir the bundle's `jaah-vendor.pth` adds (`site.addsitedir`, so a
# wheel's own `.pth` — pywin32's — is processed too). Two kinds of wheel land there:
#   * the daemon's five dependencies (websockets, pyyaml, cryptography, cffi, pycparser), one pin per
#     package per platform. Their VERSIONS have one home, infra/jaah/requirements.txt, and their sha256s
#     are the hash lock's (apps/jaahd/requirements.txt): the builder refuses a wheel pin whose version is
#     not the pin's or whose sha256 the lock does not carry (load_pins), refuses a staged vendor dir holding
#     a byte no wheel's RECORD vouches for or missing one of the five at the lock's version (check_vendor),
#     and resolves each one — `_rust` and `_cffi_backend` to binaries built for the target — as the target's
#     interpreter would (the import-smoke). A bump ends here, with these URLs + sha256s; the sequence is in
#     docs/policies/jaah-package-distribution.md § The daemon's Python dependencies.
#     Pure wheels (`py3-none-any`) serve both platforms; compiled ones are cp314 (`[python] version`),
#     cryptography's abi3.
#   * Windows-only platform wheels (pywin32, pywinpty), cp314 win_amd64 — the daemon's Windows seam.

