# NOT bundle artifacts: the platform-bundle builder reads only `[python]` and `[[artifact]]`. These are the
# single home of every runner CLI version a node installs; `apps/jaahd/runner_cli_pins.py` is the one
# reader (the package's post-install, the vnode CLI installer and the OMX refresh in `omx_layer.py` all
# resolve `name@version` through it, never an unpinned latest), and a node whose installed version differs from the
# pin reinstalls it on the next converge. The file ships to nodes in the bundle tree
# (the bundle builder's MANIFEST). ENFORCED: `runner_cli_pins.py install` refuses a tarball whose
# sha512 is not `integrity`, and installs its dependencies from the committed lock in
# `packaging/runner-cli-locks/`. Bump a CLI by changing `version` AND `integrity` together (`integrity` is
# `npm view <name>@<version> dist.integrity`), then regenerate its lock in the same commit:
# `python3 apps/jaahd/runner_cli_pins.py lock <name>`.
#
# Each `[[npm]]`:
#   name       the npm package
#   bin        the binary it links into `~/.local/bin` (what the presence check looks for)
#   version    exact, never a range or a tag
#   integrity  sha512 SRI of the tarball
#   replaces   optional: the package this one renamed. Installers uninstall it first, since npm refuses to
#              link a bin another package still owns (EEXIST)
#   patches    optional: repo paths of unified diffs applied, in order and exactly, to the verified tarball's
#              tree before its dependencies install; one that does not apply refuses the install. A patch
#              lives under `packages/acp-forks/<name>/` with the README saying why and how to drop it

# Moves TOGETHER with the Windows bundle's `codex` artifact above (one CLI version on every node).
[[npm]]
name = "@openai/codex"
bin = "codex"
version = "0.163.0"
integrity = "sha512-HNd7vR9oTK6M2ikxFnvNDCdYUgAsyo9VVnd5KnEd2ON0GYI++7MiX9XNPUkhtdgGKFPsWS+CEppQ1UU63uVhUw=="

