# Google Antigravity's CLI (`agy`): a closed native binary with no npm package, so a release tarball at a
# pinned URL. `sha256` is the tarball's, `bin_sha256` the extracted `antigravity` binary's (what a node
# hashes to decide it already has the pinned build). Bump all values together, from
# https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/linux_<arch>.json (its `url`).
[agy]
version = "1.2.11"
release = "https://storage.googleapis.com/antigravity-public/antigravity-cli/1.2.11-6016716732497920"
sha256 = { amd64 = "c91c62c5e6fa954f5a7e1d7b9ad417d749db4aa60a4ba0b3d604dec1b645d190", arm64 = "01513bc61f9592353045ba801ebb407fbccb8984fcbfde591bc6b681b24e92bc" }
bin_sha256 = { amd64 = "ec7cf797ecb0e1d91ddf3b6d9d6c1d616bb89f78a5b0e43536b72a7fce695f56", arm64 = "1ab3a89cbf1b6ef03ef33030c76ad13fbb9dead2566d5c83488e87ddbf619a8a" }

# Google's ACP server for Antigravity (`agy_acp_server`, ACP registry id `antigravity-acp`): a closed native
# binary, so a release zip at a pinned URL per arch. `sha256` is the zip's, `bin_sha256` the extracted
# `agy_acp_server.par`'s (what a node hashes to decide it already has the pinned build). The zip also holds
# `localharness_external`, which the server finds beside its real path. About 1.06 GB unpacked; the installer
# refuses without headroom (`runner_cli_pins.py agy-acp-install`). Bump all values together, from
# https://raw.githubusercontent.com/agentclientprotocol/registry/main/antigravity-acp/agent.json, and re-measure
# the unpacked size.
[agy-acp-server]
version = "1.4.1"
release = { amd64 = "https://dl.google.com/agy-extensions/releases/linux/agy-acp-server-1.4.1-linux-x86_64.zip", arm64 = "https://dl.google.com/agy-extensions/releases/linux/agy-acp-server-1.4.1-linux-arm64.zip" }
sha256 = { amd64 = "2e37012ceb2a5c7fc7309b6e6596234fb637ee3c62a5199f65d4cbe777871384", arm64 = "609336a1c97545487e3ddd55dbd153dc0f40f4e6534486cc1c5f4c0ebb85c2da" }
bin_sha256 = { amd64 = "57e7c4c505fdc8787993d4ff868274f44fd7aa4e4c82cf424fece3bf6c487643", arm64 = "7d3eb1fab7b5b60a545004f91850609ae6c345abceffbd82b4959385069f9ffe" }
