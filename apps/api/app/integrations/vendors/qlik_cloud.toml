slug = "qlik_cloud"
label = "Qlik Cloud"
category = "data"
vendor_docs_url = "https://qlik.dev/authenticate/api-key/generate-your-first-api-key/"
summary = "Lets agents list and reload Qlik Sense apps, read spaces and data files, and automate a Qlik Cloud tenant."

[[auth]]
kind = "key"
fields = [
  { key = "base_url", label = "Tenant URL", kind = "url", required = true, placeholder = "https://yourtenant.us.qlikcloud.com", help = "The address you open Qlik Cloud at, such as https://yourtenant.eu.qlikcloud.com, with no path after it" },
  { key = "api_key", label = "API key", kind = "secret", required = true, help = "Qlik Cloud > your profile picture > Profile settings > API keys > Generate new key; copy it when it is shown" },
]

[test]
method = "GET"
path = "{base_url}/api/v1/spaces?limit=1"
auth = { field = "api_key", header = "Authorization", prefix = "Bearer" }
list_field = "data"

[docs]
agent_uses = [
  "List apps, spaces and data files, and read app metadata",
  "Reload an app and check the reload's status and log",
  "Run and monitor Qlik Automate automations",
  "Manage users, groups and space membership with an admin's key",
]
prerequisites = [
  "A Qlik Cloud tenant and its address",
  "A Tenant Admin who turns on API keys: Administration > Settings > API keys > Enable API keys, and sets the maximum key lifetime",
  "The Developer role (or a custom role with the Manage API keys permission) for the user who generates the key",
]
limitations = [
  "An API key acts as the user who generated it, with that user's roles and space access",
  "API keys expire after the lifetime the Tenant Admin set; replace the key in Jaah before it lapses",
  "Qlik Sense Enterprise on Windows (client-managed) is not Qlik Cloud and is not supported by this connection",
]
troubleshooting = [
  { symptom = "Test says Qlik Cloud rejected the API key (401)", fix = "The key is wrong, expired or was revoked. Generate a new one in Profile settings > API keys, select Replace on the secret, and paste it" },
  { symptom = "The API keys section is missing from Profile settings", fix = "API keys are turned off for the tenant or your role lacks them. A Tenant Admin turns them on in Administration > Settings > API keys and gives you the Developer role" },
  { symptom = "Test says Qlik Cloud returned HTTP 404", fix = "The Tenant URL is not your tenant's root. Use the address in your browser, such as https://yourtenant.us.qlikcloud.com, with no path" },
]
faq = [
  { q = "Can I use an OAuth client instead of an API key?", a = "Not yet. Jaah connects Qlik Cloud with an API key; a key generated by a dedicated service user keeps agents' access separate from yours" },
]
