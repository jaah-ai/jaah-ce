# DeepWiki (Cognition): hosted MCP server over AI-generated wikis of public GitHub repositories. Facts confirmed at
# https://docs.devin.ai/work-with-devin/deepwiki-mcp (one endpoint, Streamable HTTP or legacy SSE at /sse, no
# authentication, public repositories only). Probed 2026-11-10: initialize without auth answers 200.
slug = "deepwiki"
label = "DeepWiki"
category = "mcp"
vendor_docs_url = "https://docs.devin.ai/work-with-devin/deepwiki-mcp"
summary = "Read and ask questions about any public GitHub repository's documentation through the DeepWiki MCP server."

[[auth]]
kind = "mcp"

[mcp]
url = "https://mcp.deepwiki.com/mcp"
url_editable = false
transport = "streamable_http"
auth = "none"

[docs]
agent_uses = [
  "Read the structure and pages of a public repository's DeepWiki before integrating with it",
  "Ask a question about how a public open-source project works and get an answer grounded in its code",
]
prerequisites = [
  "Nothing to sign up for: the server is free and open. An Org Owner or Admin adds the secret once, then links it on each project's MCP tab",
]
limitations = [
  "Public GitHub repositories only; private repositories need Devin's own MCP server and a Devin API key (add it as a Custom MCP server)",
  "Agents get DeepWiki only in the projects the secret is linked to",
]
troubleshooting = [
  { symptom = "Test cannot complete the MCP handshake", fix = "DeepWiki is unreachable or changed its endpoint. Check https://docs.devin.ai/work-with-devin/deepwiki-mcp and try again later" },
  { symptom = "An agent gets no answer for a repository", fix = "The repository is private or DeepWiki has not indexed it yet. Open https://deepwiki.com and request the repository" },
  { symptom = "New tasks on the project have no DeepWiki tools", fix = "Link the secret on the project's MCP tab, then start a new task. Tasks already running keep the tools they started with, and an agent marked Not supported on that tab cannot load MCP servers" },
]
faq = [
  { q = "Why add a secret for a server with no key", a = "The secret is the connection a project links. It holds no key here, but it decides which projects' agents get DeepWiki's tools" },
  { q = "What does Test do", a = "It opens an MCP session with DeepWiki's server and lists its tools, then closes the session" },
]
