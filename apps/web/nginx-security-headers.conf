# The security headers every document and asset response carries, on the console and on the docs site
# alike. Included into each nginx location that sets headers of its own (apps/web/nginx.conf.template),
# because `add_header` is not inherited into a location that declares any — one file, so the two sites
# and their locations cannot drift apart. Installed at /etc/nginx/snippets/ by the frontend image.
#
# HSTS carries NO includeSubDomains, deliberately — the public name is the PARENT of dev./main. and of the
# per-node records under them, and asserting HTTPS across a subtree this change does not own is not its
# call to make.
add_header Strict-Transport-Security "max-age=63072000" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
