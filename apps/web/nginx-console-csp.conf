# THE CONSOLE'S CONTENT-SECURITY-POLICY — enforcing, never Report-Only. The single home of the policy: nginx
# includes this file in the console's document location (apps/web/nginx.conf.template, `location /`), and
# the Vite dev server reads the quoted value below and sends it on every page it serves
# (apps/web/vite.config.ts, `consoleCspPlugin`), so the whole Playwright suite runs under exactly this policy.
# The docs site never includes it (its own headers are apps/web/nginx-security-headers.conf alone).
#
# Each source and why it is here — an entry nobody can explain is an entry to delete:
# * 'self' — the SPA, its hashed assets, the api (/api/*, its SSE stream and WebSockets), the artifact and PDF
#   frames (same-origin /api/... content routes, sandboxed in the page).
# * Stripe.js + Elements + 3D Secure — Stripe's published list (docs.stripe.com/security/guide, "Content
#   Security Policy", read 2026-10-02): script-src and frame-src js.stripe.com and *.js.stripe.com,
#   frame-src hooks.stripe.com (3DS / redirect flows), connect-src api.stripe.com. Stripe.js is LOADED from
#   js.stripe.com only (`@stripe/stripe-js/pure`, the console's Stripe loader) — never bundled or self-hosted.
#   maps.googleapis.com, which the same page lists, is left out: it serves only the Address Element with
#   our own Maps key, and the console uses neither.
# * Link (Stripe's saved-payment network, offered inside the Payment Element) — the same page's Link list:
#   frame-src and connect-src link.com and *.link.com, img-src *.link.com.
# * Google Sign-In — Google's published list (developers.google.com/identity/gsi/web, "Content Security
#   Policy"): script-src accounts.google.com/gsi/client, frame-src and connect-src accounts.google.com/gsi/,
#   style-src accounts.google.com/gsi/style.
# * reCAPTCHA Enterprise — Google's published list (cloud.google.com/recaptcha/docs/faq, "Content Security
#   Policy"): script-src www.google.com/recaptcha/ and www.gstatic.com/recaptcha/, frame-src
#   www.google.com/recaptcha/ and recaptcha.google.com/recaptcha/, connect-src www.google.com/recaptcha/. Loaded
#   only when a visitor submits the Trust page's document request form (the console's reCAPTCHA loader, from the
#   legal pages' document request form) — the same sources the Live Cast policy (nginx-live-csp.conf) carries.
# * connect-src wss: — the direct console (apps/web/src/lib/directConsole.ts) dials a node's own
#   `wss://<node>.<tailnet>:<port>` URL, whose host and port are per-node values the api hands out at
#   runtime; secure WebSockets only.
# * connect-src and img-src https://*.amazonaws.com — attachments go straight to S3: the browser PUTs to a
#   presigned `https://<bucket>.s3.<region>.amazonaws.com/...` URL (connect-src), and an attachment image —
#   a fetch, or a plain <img> on a comment or ticket — follows the api's 307 to one (connect-src, img-src;
#   apps/api/app/attachment_storage.py). A local stack proxies storage same-origin, so the e2e run cannot
#   see this one: a test of the deployed config pins it instead.
# * style-src 'unsafe-inline' — the console's own styling engine (Emotion, under MUI) injects <style>
#   elements at runtime, and xterm sets inline styles. Stripe needs none: Elements style inside their frames.
# * img-src data: blob: — the inline SVG favicon; attachment images, read as blobs.
# * frame-ancestors 'none' — nothing may frame the console (X-Frame-Options DENY says the same for old
#   browsers).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com https://*.js.stripe.com https://accounts.google.com/gsi/client https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://*.link.com https://*.amazonaws.com; font-src 'self' data:; connect-src 'self' wss: https://*.amazonaws.com https://api.stripe.com https://link.com https://*.link.com https://accounts.google.com/gsi/ https://www.google.com/recaptcha/; frame-src 'self' https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com https://link.com https://*.link.com https://accounts.google.com/gsi/ https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
