[pytest]
testpaths = tests
pythonpath = .
markers =
    real_shared_root: this case's subject is the LITERAL value of shared_storage.LEGACY_SHARED_ACCOUNTS_ROOT, so conftest's autouse sandbox posture must give it a PROVISIONED posture with the shared tree unfenced.
    provisioned_posture: this case characterizes what a PROVISIONED node resolves, so conftest's autouse sandbox posture gives it a synthetic provisioned node (a readable node.env under a temp root) instead.
    session_user_switch: this case's subject IS the uid switch, so conftest's autouse sandbox posture leaves JAAH_SESSION_USER alone instead of emptying it. Carried by no case today and registered anyway: the opt-out is consumed in conftest, and an unregistered marker greets its first user with a PytestUnknownMarkWarning rather than working.
