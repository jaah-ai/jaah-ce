# fleet-tmux.conf — the whole configuration of the isolated fleet tmux server
# (`fleet_tmux_server.converge_activated` starts it with `-f` on this file). Root-owned in the package: a runner
# can neither edit it nor make the server read another. Nothing else configures this server — no runner, and
# not the loop that starts it, can connect to it — so what must hold on it is here.
# `$JAAH_DAEMON_USER` and `$JAAH_FLEET_SESSION` are the server's own environment, set by the loop.

# The daemon is the server's only client: write access, because it creates, kills, pipes and resizes.
server-access -aw "$JAAH_DAEMON_USER"

# The server outlives its last session (`fleet_tmux_server._converge_options`' reason).
set-option -s exit-empty off

# Mirrors `fleet_launch.vis_window` (`-g`: no session exists yet to target).
set-option -g mouse on

# The holder keeps the session through runner churn (`fleet_tmux_server.HOLDER_WINDOW`). Sized like `fleet_tmux_server.SESSION_WIDTH`/`SESSION_HEIGHT`.
new-session -d -s "$JAAH_FLEET_SESSION" -n _holder -x 220 -y 50 "sleep infinity"
