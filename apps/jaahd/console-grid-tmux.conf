# console-grid-tmux.conf — the daemon's own tmux server for a console LAYOUT grid, used when the fleet server
# is isolated (`console._grid_socket`). Its panes are the DAEMON's: each runs a nested client of the fleet
# server. So a viewer must never get a command here — no prefix, no key binding, no menu — only the mouse,
# forwarded to the tile under it. Root-owned in the package; read once, when the first grid starts the server.
set-option -g prefix None
set-option -g prefix2 None
unbind-key -a -T root
unbind-key -a -T prefix
unbind-key -a -T copy-mode
unbind-key -a -T copy-mode-vi
# Click to focus a tile; every mouse event otherwise goes to the nested client under it.
bind-key -n MouseDown1Pane select-pane -t = \; send-keys -M
bind-key -n MouseDrag1Pane send-keys -M
bind-key -n MouseUp1Pane send-keys -M
bind-key -n WheelUpPane send-keys -M
bind-key -n WheelDownPane send-keys -M
set-option -g mouse on
set-option -g status off
set-option -g remain-on-exit on
