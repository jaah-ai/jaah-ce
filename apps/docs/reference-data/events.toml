# The real-time event catalog — the single home of what the event stream (`GET /api/stream`) can send.
#
# `tools/event_catalog.py --write` renders `apps/docs/content/real-time/event-stream/event-catalog.md`
# from this file; `apps/api/test_event_catalog.py` (quick gate) fails when an `emit_console_event` call
# site in `apps/api/app` names an entity or action missing here, when an entity or action here is emitted
# nowhere, or when the committed page differs from a fresh render.
#
# `verified`: the day this catalog was last checked against the code; the page's `last_verified`.
#
# [[entity]]
#   name     — the wire `entity` string.
#   title    — the section heading on the page.
#   audience — who receives it (mirrors `_may_see` in apps/api/app/routes/stream.py):
#              `members`    — any member who may see that row (the same rule as reading it);
#              `own-org`    — every member of the org it happened in;
#              `org-admins` — the organization's owners and admins;
#              `operator`   — the Jaah operator only. Kept here for the drift check, never rendered.
#   id       — what the wire `id` carries for this entity, in reader terms.
#   summary  — one sentence: what changed.
#   example_id — the `id` in the page's example event: an integer for an integer id (task, command), a
#              uuid string for a uuid id, `0` where the id is always `0`. Required unless `operator`.
#   [[entity.action]] name, when — the wire `action` string and when it fires, in user terms. Optional
#     `audience = "operator"` when the relay never delivers this action to a tenant (it is then not
#     rendered), with an optional `note` the page shows instead, telling the reader what to do.
#
# [[dynamic]] — a call site whose `action` is not a string literal. One entry per (file, entity) covers
#   every such site in that file. `source` is a dotted importable name whose value is the set (or the
#   single string) of actions it can carry; `values` lists them instead when no constant holds them, or
#   the extra actions beside `source` (with `reason`). Every value must also appear as an action of that
#   entity above.

verified = 2026-11-13

[[entity]]
name = "task"
title = "Tasks"
audience = "members"
id = "The task's id — the number in its console address (`/tasks/{id}`)."
summary = "A task, epic or chat changed."
example_id = 4916

  [[entity.action]]
  name = "created"
  when = "A task, epic or chat was created — by a person, a schedule or an agent."

  [[entity.action]]
  name = "updated"
  when = "A task's fields were edited (title, body, settings)."

  [[entity.action]]
  name = "deleted"
  when = "A task was deleted."
  audience = "operator"
  note = "The task is gone before access is checked. Refetch the list to notice a removal."

  [[entity.action]]
  name = "titled"
  when = "Jaah generated a title for the task."

  [[entity.action]]
  name = "tagged"
  when = "The task's tags changed."

  [[entity.action]]
  name = "rated"
  when = "Someone rated the task's result."

  [[entity.action]]
  name = "outcome_judged"
  when = "An Owner or Admin confirmed, dismissed or added a defect link, so the task's outcome may have changed."

  [[entity.action]]
  name = "metered"
  when = "A running task's usage and cost figures were updated."

  [[entity.action]]
  name = "prioritized"
  when = "The task's priority changed."

  [[entity.action]]
  name = "dependency_added"
  when = "The task was made to wait on another task."

  [[entity.action]]
  name = "dependency_removed"
  when = "A dependency was removed from the task."

  [[entity.action]]
  name = "control_message"
  when = "The control plane queued a message for the task's live runner, or the runner's node typed it in."

  [[entity.action]]
  name = "stale"
  when = "A task this one depends on changed, so its result may be out of date."

  [[entity.action]]
  name = "agent_filing_deduped"
  when = "The agent working on this task asked to file a task that already exists, so the existing one was kept."

  [[entity.action]]
  name = "set_state"
  when = "Someone set the task's state by hand, or a child's new state reactivated its epic."

  [[entity.action]]
  name = "run"
  when = "Someone started or restarted the task, or Jaah reopened it to finish its pull request."

  [[entity.action]]
  name = "stop"
  when = "Someone stopped the task."

  [[entity.action]]
  name = "reset"
  when = "Someone reset the task to run again from the start."

  [[entity.action]]
  name = "complete"
  when = "Someone marked the task complete."

  [[entity.action]]
  name = "draft"
  when = "The task moved to Draft."

  [[entity.action]]
  name = "ready"
  when = "The task moved to Ready — queued to start."

  [[entity.action]]
  name = "active"
  when = "The task moved to Active — an agent is working on it."

  [[entity.action]]
  name = "awaiting_response"
  when = "The task moved to Awaiting response — it asked a question someone must answer."

  [[entity.action]]
  name = "paused"
  when = "The task moved to Paused — its work stopped and is held for a resume."

  [[entity.action]]
  name = "system_failed"
  when = "The task moved to Failed — Jaah used up its attempts."

  [[entity.action]]
  name = "done"
  when = "The task moved to Done."

