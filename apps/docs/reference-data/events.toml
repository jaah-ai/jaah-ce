# [[webhooks.event]] — the outgoing webhook event catalog (`apps/api/app/webhooks/catalog.py` reads it at import and
#   validates an endpoint's `event_types` against it; `tools/event_catalog.py` renders it on the Event catalog page).
#   type        — the wire `type` (the `X-Jaah-Event` header and the body's `type`).
#   label       — its name in the console.
#   description — one sentence: when it is sent.
#   kinds       — the `activity_events.kind` values it is made from; empty for `ping`, which only a test sends.

[[webhooks.event]]
type = "ping"
label = "Ping"
description = "Sent only when you press Send test on an endpoint, to check it receives and verifies deliveries."
kinds = []

[[webhooks.event]]
type = "task.created"
label = "Task created"
description = "A task was created in a project."
kinds = ["task:created"]

[[webhooks.event]]
type = "task.started"
label = "Task started"
description = "A task started running on a node."
kinds = ["task:active"]

[[webhooks.event]]
type = "task.awaiting_response"
label = "Task awaiting response"
description = "A task asked a question and is waiting for an answer."
kinds = ["task:awaiting_response"]

[[webhooks.event]]
type = "task.done"
label = "Task done"
description = "A task finished."
kinds = ["task:done"]

[[webhooks.event]]
type = "task.failed"
label = "Task failed"
description = "A task failed and stopped running."
kinds = ["task:system_failed"]

[[webhooks.event]]
type = "task.stopped"
label = "Task stopped"
description = "Someone stopped a task."
kinds = ["task:stop"]

[[webhooks.event]]
type = "pr.opened"
label = "Pull request opened"
description = "A task opened a pull request."
kinds = ["pr:opened"]

[[webhooks.event]]
type = "pr.merged"
label = "Pull request merged"
description = "A pull request a task opened was merged. Pull requests opened outside a task don't fire it."
kinds = ["pr:merged"]
